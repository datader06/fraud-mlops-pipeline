version: "3.9"

services:
  # ------------------------------------------------------------------
  # MLflow Tracking Server
  # ------------------------------------------------------------------
  mlflow:
    image: python:3.11-slim
    container_name: fraud-mlflow
    working_dir: /app
    command: >
      bash -c "pip install mlflow==2.10.0 --quiet &&
               mlflow server
               --host 0.0.0.0
               --port 5000
               --backend-store-uri sqlite:///mlruns.db
               --default-artifact-root /app/mlartifacts"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/app/mlruns.db
      - mlflow_artifacts:/app/mlartifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - fraud-net

  # ------------------------------------------------------------------
  # FastAPI Model Serving
  # ------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./configs:/app/configs:ro
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - fraud-net

volumes:
  mlflow_data:
  mlflow_artifacts:

networks:
  fraud-net:
    driver: bridge
